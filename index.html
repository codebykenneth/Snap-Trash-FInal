<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1e1f22" />
<title>Snap Trash — Snap It. Report It. Clean It.</title>
<meta name="description" content="Report garbage, connect with local cleaners, keep your community clean." />
<link rel="icon" href="Image/logo.jpg" type="image/svg+xml" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<script>
  (function () {
    try {
      var pref = localStorage.getItem('st-theme-pref');
      if (pref === 'light' || pref === 'dark') document.documentElement.setAttribute('data-theme', pref);
    } catch (e) {}
  })();
</script>
</head>
<body>

  <header class="topbar" id="topbar"></header>

  <main id="app" class="app-main"></main>

  <nav class="bottomnav" id="bottomnav"></nav>

  <div id="toast-root" class="toast-root"></div>
  <div id="modal-root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
